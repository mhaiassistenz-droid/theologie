<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{TITLE}} – Notizen zum Lesen">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css?v={{V}}">
</head>
<body data-title="{{TITLE}}">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Verzeichnis">
    <div class="sidebar-header">
      <span class="vault-name">{{TITLE}}</span>
      <span class="sidebar-actions">
        <button class="icon-btn" id="collapse-all" type="button" title="Alle Ordner einklappen" aria-label="Alle Ordner einklappen">
          <svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
        </button>
        <button class="icon-btn close-btn" id="close-btn" type="button" aria-label="Verzeichnis schließen">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </span>
    </div>
    <nav class="tree" id="tree" aria-label="Notizen"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <header class="view-header">
      <span class="nav-btns">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Verzeichnis öffnen" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <button class="icon-btn hist-btn" id="back-btn" type="button" aria-label="Zurück">
          <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </button>
        <button class="icon-btn hist-btn" id="fwd-btn" type="button" aria-label="Vorwärts">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </span>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Pfad"></nav>
    </header>
    <article class="view-content" id="content" aria-live="polite">
      <noscript><p>Diese Seite braucht JavaScript.</p></noscript>
    </article>
  </main>
</div>
<script id="tree-data" type="application/json">{{TREE}}</script>
<script src="app.js?v={{V}}"></script>
</body>
</html>
